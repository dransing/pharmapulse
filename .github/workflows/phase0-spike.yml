name: Phase 0 Feasibility Spike

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the feasibility spike
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/phase0_spike.py

      - name: Upload the report as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-report
          path: phase0_report.md
          if-no-files-found: warn
